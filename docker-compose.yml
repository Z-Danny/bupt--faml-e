services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: famlee-web
    restart: always
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: famlee-api
    restart: always
    env_file:
      - .env.production
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - /opt/data/famlee/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  db:
    image: postgres:16-alpine
    container_name: famlee-db
    restart: always
    env_file:
      - .env.production
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - /opt/data/famlee/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
